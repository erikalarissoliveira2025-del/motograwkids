name: Build Moto Grau Kids APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q Moto_Grau_Kids_GitHub_Compilar.zip -d extracted
      - name: Build APK
        run: gradle --no-daemon -p extracted assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Moto-Grau-Kids-debug-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
